name: Release Get Tag
description: Validate the release branch, compute the next release tag, and check it does not already exist.
inputs:
  is_prerelease:
    description: Set true to compute an RC tag, false for stable promotion.
    required: true
  release_branch:
    description: Release branch name.
    required: true
  release_branch_prefix:
    description: Prefix required for release branches.
    required: false
    default: releases/
  release_tag_prefix:
    description: Prefix to add to computed tags.
    required: false
    default: v
  require_rc_before_stable:
    description: Set true to require a prior RC tag on the branch before promoting to stable.
    required: false
    default: 'false'
  validate_branch:
    description: Set true to validate that release_branch starts with release_branch_prefix.
    required: false
    default: 'true'
  check_tag_not_exists:
    description: Set true to fail if the computed tag already exists.
    required: false
    default: 'true'
outputs:
  tag:
    description: Computed release tag.
runs:
  using: node24
  main: dist/index.js

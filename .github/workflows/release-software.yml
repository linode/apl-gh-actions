name: Release Software

on:
  workflow_dispatch:
    inputs:
      is_prerelease:
        description: 'Cut an RC tag instead of a stable tag'
        required: true
        type: boolean
      dry_run:
        description: 'Skip all writes (tag, release, and Docker push)'
        required: true
        type: boolean

env:
  RELEASE_BRANCH: ${{ github.ref_name }}
  RELEASE_BRANCH_PREFIX: 'releases/'
  RELEASE_TAG_PREFIX: 'v'


jobs:
  release-get-tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.compute-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          # This is required to fetch all tags so that release-get-tag can find the highest tag on the branch
          fetch-depth: 0

      - name: Validate branch, compute release tag, and check it does not already exist
        id: compute-tag
        uses: linode/apl-gh-actions/actions/release-get-tag@main
        with:
          is_prerelease: ${{ inputs.is_prerelease }}
          release_branch: ${{ env.RELEASE_BRANCH }}
          release_branch_prefix: ${{ env.RELEASE_BRANCH_PREFIX }}
          release_tag_prefix: ${{ env.RELEASE_TAG_PREFIX }}
          require_rc_before_stable: false
          check_tag_not_exists: true
          validate_branch: true

  release-software:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs:
      - release-get-tag
    env:
      GIT_TAG: ${{ needs.release-get-tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Create and push git tag
        uses: linode/apl-gh-actions/actions/release-tag@main
        with:
          release_tag: ${{ env.GIT_TAG }}
          dry_run: ${{ inputs.dry_run }}

      - name: Create GitHub Release
        uses: linode/apl-gh-actions/actions/release-create-github-release@main
        with:
          release_tag: ${{ env.GIT_TAG }}
          is_prerelease: ${{ inputs.is_prerelease }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

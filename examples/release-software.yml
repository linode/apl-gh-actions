name: Release Software

on:
  workflow_call:
    inputs:
      is_prerelease:
        description: 'Cut an RC tag instead of a stable tag'
        required: true
        type: boolean
      dry_run:
        description: 'Skip all writes (tag, release, and Docker push)'
        required: true
        type: boolean
      container_registry:
        description: 'Container registry to push release images to (e.g.: docker.io, ghcr.io, etc.)'
        required: true
        type: string
      container_image:
        description: 'Container repository to push release images to. Can contain org name (e.g. linode/apl-gh-actions)'
        required: true
        type: string
      release_branch_prefix:
        description: 'Prefix required for release branches'
        required: false
        default: 'releases/'
        type: string
      release_tag_prefix:
        description: 'Prefix to add to release tags'
        required: false
        default: 'v'
        type: string
      require_rc_before_stable:
        description: 'Require a prior RC tag on the branch before promoting to stable'
        required: false
        default: false
        type: boolean
    secrets:
      oci_username:
        description: 'Username used to authenticate to the container registry'
        required: true
      oci_password:
        description: 'Password or token used to authenticate to the container registry'
        required: true

env:
  RELEASE_BRANCH: ${{ github.ref_name }}
  OCI_USERNAME: ${{ secrets.DOCKERHUB_LINODEBOT_USERNAME }}
  OCI_PASSWORD: ${{ secrets.DOCKERHUB_LINODEBOT_TOKEN }}

jobs:
  release-get-tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.compute-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate branch, compute release tag, and check it does not already exist
        id: compute-tag
        uses: linode/apl-gh-actions/actions/release-get-tag@v0.3.0
        with:
          is_prerelease: ${{ inputs.is_prerelease }}
          release_branch: ${{ github.ref_name }}
          release_branch_prefix: ${{ inputs.release_branch_prefix }}
          release_tag_prefix: ${{ inputs.release_tag_prefix }}
          require_rc_before_stable: ${{ inputs.require_rc_before_stable }}

  release-software:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs:
      - release-get-tag
    env:
      GIT_TAG: ${{ needs.release-get-tag.outputs.release_tag }}
      CONTAINER_IMAGE_TAG: ${{ inputs.container_registry }}/${{ inputs.container_image }}:${{ needs.release-get-tag.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Create and push git tag
        uses: linode/apl-gh-actions/actions/release-tag@v0.3.0
        with:
          release_tag: ${{ env.GIT_TAG }}
          dry_run: ${{ inputs.dry_run }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to OCI registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.container_registry }}
          username: ${{ env.OCI_USERNAME }}
          password: ${{ env.OCI_PASSWORD }}

      - name: Push to OCI registry
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@v7
        with:
          push: true
          load: true
          context: .
          build-args: |
            VERSION=${{ env.GIT_TAG }}
          tags: ${{ env.CONTAINER_IMAGE_TAG }}

      - name: Create GitHub Release
        uses: linode/apl-gh-actions/actions/release-create-github-release@v0.3.0
        with:
          release_tag: ${{ env.GIT_TAG }}
          is_prerelease: ${{ inputs.is_prerelease }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
name: Release Get Tag

on:
  workflow_call:
    inputs:
      is_prerelease:
        description: 'Derive an RC tag instead of a stable tag'
        required: true
        type: boolean
      release_branch:
        description: 'Release branch to derive the tag from'
        required: true
        type: string
      release_branch_prefix:
        description: 'Prefix required for release branches'
        required: false
        default: 'releases/'
        type: string
      release_tag_prefix:
        description: 'Prefix to add to release tags'
        required: false
        default: 'v'
        type: string
      require_rc_before_stable:
        description: 'Require a prior RC tag on the branch before promoting to stable'
        required: false
        default: false
        type: boolean
    outputs:
      release_tag:
        description: 'Derived and validated release tag'
        value: ${{ jobs.release-get-tag.outputs.release_tag }}

jobs:
  release-get-tag:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.compute-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0

      - name: Validate branch, compute release tag, and check it does not already exist
        id: compute-tag
        uses: linode/apl-gh-actions/actions/release-get-tag@v0.3.0
        with:
          is_prerelease: ${{ inputs.is_prerelease }}
          release_branch: ${{ inputs.release_branch }}
          release_branch_prefix: ${{ inputs.release_branch_prefix }}
          release_tag_prefix: ${{ inputs.release_tag_prefix }}
          require_rc_before_stable: ${{ inputs.require_rc_before_stable }}